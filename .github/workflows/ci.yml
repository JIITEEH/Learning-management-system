name: CI

on:
  push:
    branches: [main, dev-current]
  pull_request:
    branches: [main, dev-current]

# The job only reads the checkout; it needs nothing else.
permissions:
  contents: read

# A new push to the same branch makes the previous run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The declared minimum in package.json, and the next LTS line.
        node: ["22.13", "24"]

    # A throwaway database for the run. It is created empty and built by
    # `npm run db:setup`, so the schema and the structural seed are exercised
    # on every push rather than only when somebody remembers to run them.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: lms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: lms

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: lms
      SESSION_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Through the npm script, not by piping files into mysql: the script
      # reads the same .env-backed config as the server, applies schema/ and
      # seed/ in their numbered order, and baselines the migration ledger.
      - name: Build the database
        run: npm run db:setup

      - name: Check the database reports itself ready
        run: npm run db:status

      - name: Boot the server and check it answers
        run: |
          npm start &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          # A protected route must refuse an anonymous caller.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me)" = "401"
