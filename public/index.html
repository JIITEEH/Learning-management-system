<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060709">
<title>LearnHub — Learning Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script type="module" src="assets/js/pages/home.js"></script>
</head>
<body>
<main class="centred">
  <div class="centred-card">

    <span class="centred-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5 12 12l8-6.5M4 18.5 12 12l8 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      LearnHub
    </span>

    <section class="card">
      <h1>Courses, lessons, and grades in one place</h1>
      <p class="card-intro">
        Instructors publish course material and set assignments. Students read,
        submit, and see their marks. Administrators decide who may do what.
      </p>

      <!-- Both sets of actions are in the markup, and the one that does not
           apply is removed once the server has said who is here. Written this
           way round so the page still offers a way in if its script never
           runs. -->
      <div class="form" data-signed-out>
        <a class="btn btn-primary btn-lg btn-block" href="pages/login.html">Sign in</a>
        <a class="btn btn-lg btn-block" href="pages/register.html">Create an account</a>
      </div>

      <div class="form" data-signed-in hidden>
        <a class="btn btn-primary btn-lg btn-block" href="pages/dashboard.html">Go to your dashboard</a>
      </div>
    </section>

  </div>
</main>
</body>
</html>
