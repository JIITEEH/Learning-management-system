<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060709">
<title>Sign in — Learning Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<script type="module" src="../assets/js/pages/login.js"></script>
</head>
<body>
<main class="centred">
  <div class="centred-card">

    <a class="centred-brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5 12 12l8-6.5M4 18.5 12 12l8 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      LearnHub
    </a>

    <section class="card">
      <h1>Sign in</h1>
      <p class="card-intro">Use the email address your account was created with.</p>

      <p class="notice notice-error" data-notice hidden></p>

      <form class="form" data-form novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" name="email" type="email"
                 autocomplete="email" required autofocus>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      </form>

      <p class="centred-foot">
        No account yet? <a href="register.html">Create one</a>
      </p>
    </section>

  </div>
</main>
</body>
</html>
